<style>
:root{--bg:#0a0a0a;--card:#141414;--line:#2a2a2a;--red:#C8102E;--redh:#a30d26;--txt:#f2f2f2;--mut:#a6a6a6;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:radial-gradient(120% 60% at 50% 0%,#2a0710 0%,var(--bg) 60%) no-repeat,var(--bg);color:var(--txt);font-family:var(--sans);padding:calc(36px + env(safe-area-inset-top,0px)) 20px calc(36px + env(safe-area-inset-bottom,0px))}
main{max-width:460px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.out{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:5;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:22px;background:rgba(20,20,20,.85);backdrop-filter:blur(6px);color:var(--txt);font:600 .88rem var(--sans);cursor:pointer}
.out:hover,.out:focus-visible{border-color:var(--red);outline:none}
.out span{color:var(--red);font-size:1.05rem;line-height:1}
.ph{width:132px;height:132px;border-radius:50%;padding:4px;background:linear-gradient(145deg,var(--red),#4a0a14);box-shadow:0 8px 30px rgba(200,16,46,.35);position:relative;cursor:pointer;transition:transform .25s ease;-webkit-tap-highlight-color:transparent}
.ph:focus-visible{outline:2px solid #fff;outline-offset:4px}
.bal{position:absolute;right:calc(100% + 14px);top:50%;width:210px;padding:12px 14px;background:#fff;color:#111;border-radius:14px;font:500 .84rem/1.35 var(--sans);text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-50%) scale(.92);transform-origin:right center;transition:opacity .2s,transform .2s,visibility .2s;z-index:4}
.bal::after{content:"";position:absolute;left:100%;top:50%;margin-top:-8px;border:8px solid transparent;border-left-color:#fff}
.ph.open .bal{opacity:1;visibility:visible;transform:translateY(-50%) scale(1)}
@media (max-width:520px){.ph.open{transform:translateX(34px)}.bal{width:calc((100vw - 132px)/2 + 34px - 24px);padding:10px;font-size:.78rem}}
.ph img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--bg)}
h1{font-family:var(--serif);font-size:1.7rem;line-height:1.2;margin:20px 0 6px;text-align:center}
.sub{margin:0 0 28px;color:var(--mut);font-size:1rem;text-align:center}
ul{list-style:none;margin:0;padding:0;width:100%;display:grid;gap:12px}
li{position:relative}
.tip{position:absolute;left:50%;bottom:calc(100% + 12px);width:max-content;max-width:min(260px,90%);padding:10px 14px;background:#fff;color:#111;border-radius:12px;font:600 .88rem/1.3 var(--sans);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-50%) translateY(6px);transition:opacity .2s,transform .2s,visibility .2s;z-index:4}
.tip::after{content:"";position:absolute;top:100%;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:#fff}
.tip.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
a.lk{display:flex;align-items:center;gap:14px;min-height:76px;padding:14px 16px;border:1px solid var(--line);border-left:3px solid var(--red);border-radius:6px;background:var(--card);color:inherit;text-decoration:none;transition:transform .15s,border-color .2s,background .2s}
a.lk:hover,a.lk:focus-visible{background:#1a1a1a;border-color:var(--red);transform:translateY(-2px);outline:none}
a.lk:active{transform:scale(.985)}
.ic{flex:none;width:44px;height:44px;border-radius:50%;background:#1f0a0f;display:grid;place-items:center;color:var(--red)}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
a.lk.im{padding:0;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:none}
a.lk.im img{display:block;width:100%;height:auto}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:1.02rem;line-height:1.25}
.tx span{display:block;margin-top:3px;color:var(--mut);font-size:.84rem;line-height:1.35}
.ar{flex:none;color:var(--red);font-size:1.2rem}
footer{margin-top:34px;color:#6d6d6d;font-size:.78rem;text-align:center}
@media (prefers-reduced-motion:reduce){a.lk{transition:none}}
</style>
</head>

<script>
/* ===== EDITE SÓ AQUI =====
   Para adicionar outro botão, copie uma linha e mude os textos.
   ícone: key (chave), home (móveis), mega (marketing), star (outros)
   url: cole o endereço do site (ex.: https://seuusuario.github.io/mentoria/)
   img: (opcional) caminho da imagem do botão, 1200x400 px, ex.: "imagens/mentoria.webp".
        Com img, o botão vira só a imagem; sem img, aparece o botão de texto. */
const LINKS=[
 {icon:"key", title:"Mentoria", desc:"O Código da Presença Digital: acompanhamento individual", url:"ocodigo.html", img:IMG.mentoria},
 {icon:"home",title:"Modernit", desc:"Fábrica de móveis planejados", url:"https://www.instagram.com/modernitmoveis?obrf=MWtxNTBkdnVpbHlxeg==", img:IMG.modernit},
 {icon:"mega",title:"Info Digi", desc:"Agência de marketing digital", url:"https://www.instagram.com/agenciainfodigi?cplk=MTVtdGY5OWExd29kNw==", img:IMG.infodigi},
 {icon:"star",title:"RB Print", desc:"Soluções em impressão e comunicação visual", url:"https://www.instagram.com/rbprintbrasil?xtok=MWVzcGtiemNwNTR0dg==", img:IMG.rbprint},
 {icon:"star",title:"Barros Store", desc:"Equipamentos e soluções práticas", url:"", msg:"A loja online está em desenvolvimento.", img:IMG.barros}
];
const ICONS={
 key:'<circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v4M15 12v3"/>',
 home:'<path d="M4 20V9l8-5 8 5v11"/><path d="M4 20h16M9 20v-6h6v6"/>',
 mega:'<path d="M4 10v4h3l8 4V6L7 10H4z"/><path d="M18.5 9.5a4 4 0 0 1 0 5"/>',
 star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'
};
const A=l=>`href="${l.url||"#"}" ${l.url?'target="_blank" rel="noopener"':''}`;
document.getElementById("links").innerHTML=LINKS.map(l=>l.img?`<li><a class="lk im" ${A(l)} aria-label="${l.title}: ${l.desc}"><img src="${l.img}" alt="${l.title}" width="1200" height="400" loading="lazy"></a></li>`:`<li><a class="lk" ${A(l)}><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[l.icon]||ICONS.star}</svg></span><span class="tx"><b>${l.title}</b><span>${l.desc}</span></span><span class="ar" aria-hidden="true">›</span></a></li>`).join("");
/* Balão da foto de perfil: abre ao clicar, fecha ao clicar fora, no Esc ou após 8s */
(()=>{const f=document.getElementById("foto");let t;
const set=o=>{f.classList.toggle("open",o);f.setAttribute("aria-expanded",o);clearTimeout(t);if(o)t=setTimeout(()=>set(false),8000)};
f.addEventListener("click",e=>{e.stopPropagation();set(!f.classList.contains("open"))});
f.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();set(!f.classList.contains("open"))}});
document.addEventListener("click",()=>set(false));
document.addEventListener("keydown",e=>{if(e.key==="Escape")set(false)});})();
/* Botões com aviso (campo msg): mostram um balão em vez de abrir link */
(()=>{let t;const tips=[];
document.querySelectorAll("#links li").forEach((li,i)=>{const l=LINKS[i];if(!l.msg||l.url)return;
const s=document.createElement("span");s.className="tip";s.setAttribute("role","status");s.textContent=l.msg;li.appendChild(s);tips.push(s);
li.querySelector("a").addEventListener("click",e=>{e.preventDefault();e.stopPropagation();const o=!s.classList.contains("show");tips.forEach(x=>x.classList.remove("show"));clearTimeout(t);if(o){s.classList.add("show");t=setTimeout(()=>s.classList.remove("show"),4000)}})});
document.addEventListener("click",()=>tips.forEach(x=>x.classList.remove("show")));})();
/* Sair: tenta fechar; se não der, volta; sem histórico, abre o Instagram */
document.getElementById("sair").onclick=()=>{window.close();setTimeout(()=>{if(history.length>1)history.back();else location.href="https://www.instagram.com/rodrigobarrosbr/"},150)};
</script>
